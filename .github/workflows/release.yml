# Every push to main and every pull request (e.g. from Dependabot) is tested, in Firefox and Chrome. A tag like v2026.11.10.1834 on main is also submitted to addons.mozilla.org and the Chrome Web Store, each by its own job once the tests passed. The repository variables AMO_UPLOAD and CWS_UPLOAD set to 'false' skip that store.

name: Release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  # Started on a tag by dependabot.yml, whose tag push alone would start nothing.
  workflow_dispatch:

permissions:
  contents: read

# Tools Dependabot can't update; the lockfile job warns once a newer release is 7 days old.
env:
  GH_ACTIONS_LOCK_VERSION: v0.4.1
  ZIZMOR_VERSION: 1.32.0

jobs:
  # actions.lock must match the workflows and every locked pin must still verify upstream.
  # After changing a `uses:` line, run `gh actions-lock` and commit the lockfile.
  lockfile:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin "$GH_ACTIONS_LOCK_VERSION"
      - run: gh actions-lock --verify
      # The same 7 days as the cooldown in .github/dependabot.yml.
      - name: Warn about outdated tool versions
        run: |
          check() {
            read -r tag date <<<"$(gh api "repos/$1/releases/latest" --jq '.tag_name + " " + .published_at')"
            if [ "$tag" != "$2" ] && [ "$(date -d "$date" +%s)" -lt "$(date -d '7 days ago' +%s)" ]; then
              echo "::warning::$1 $tag is out since $date, release.yml pins $2."
            fi
          }
          check github/gh-actions-lock "$GH_ACTIONS_LOCK_VERSION"
          check zizmorcore/zizmor "v$ZIZMOR_VERSION"

  # Security audit of the workflows, see https://docs.zizmor.sh. Findings fail the job.
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false

  # Static security analysis of the code and the workflows, see https://codeql.github.com.
  # Findings show under Security → Code scanning and, on a pull request, as its annotations.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No npm cache for a release: what is submitted is built from a clean install only.
      # zizmor can't evaluate the cache expression, hence the ignore.
      - uses: actions/setup-node@v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 26
          cache: ${{ env.RELEASE != 'true' && 'npm' || '' }}
          package-manager-cache: false
      - run: npm ci
      # Every package must carry the npm registry's signature: a tampered tarball fails here.
      - run: npm audit signatures
      # Known vulnerabilities in what ships with the extension (zod), not the dev tools.
      - run: npm audit --omit=dev --audit-level=moderate

      - name: Take the version from the tag
        if: env.RELEASE == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "FIREDIAL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - run: npm test

      # Mutation testing: the unit tests must notice changed logic, see stryker.config.json for the bar.
      # Incremental: results of the last run are reused, only mutants in changed code or under changed tests run again.
      # A tag runs everything once more before it is released.
      - uses: actions/cache/restore@v6.1.0
        if: env.RELEASE != 'true'
        with:
          path: reports/stryker-incremental.json
          key: stryker2-${{ github.sha }}
          restore-keys: stryker2-
      - id: mutate
        run: npm run mutate
      - uses: actions/cache/save@v6.1.0
        if: always() && steps.mutate.outcome != 'skipped' && hashFiles('reports/stryker-incremental.json') != ''
        with:
          path: reports/stryker-incremental.json
          key: stryker2-${{ github.sha }}
      # The report as one self-contained HTML file on the run page, also when the bar is missed.
      # Named date_commit_mutation.html; a pull request names its own head commit, not the merge commit.
      # Unarchived, the artifact takes the file's name, so the file is copied to that name.
      - name: Name the mutation report
        if: always() && steps.mutate.outcome != 'skipped'
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          name="$(date -u +%F)_${SHA::7}_mutation.html"
          mkdir -p reports/upload
          [ -f reports/mutation.html ] && cp reports/mutation.html "reports/upload/$name" || true
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.mutate.outcome != 'skipped'
        with:
          path: reports/upload/*_mutation.html
          archive: false
          if-no-files-found: warn

  # The AMO keys live in the environment amo, which only v* tags may use. Runs once the release
  # job tested the tag, builds it the same way and submits it. Listed versions need review, usually
  # automatic; waiting for it could outlast this job, so submit and finish.
  amo:
    name: Firefox Add-ons
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && vars.AMO_UPLOAD != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: amo
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci
      - run: FIREDIAL_VERSION="${GITHUB_REF_NAME#v}" npm run build
      - name: Submit to addons.mozilla.org
        run: |
          git ls-files -z | xargs -0 zip -q firedial-source.zip
          npx web-ext sign --source-dir dist/firefox --channel listed --amo-metadata browsers/publishing/amo-metadata.json --upload-source-code firedial-source.zip --approval-timeout 0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}

  # The Chrome Web Store's keys live in the environment chrome-web-store, which only v* tags may
  # use. Runs once the release job tested the tag, builds it the same way and submits it for review.
  cws:
    name: Chrome Web Store
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && vars.CWS_UPLOAD != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false
      - run: npm ci
      - run: FIREDIAL_VERSION="${GITHUB_REF_NAME#v}" npm run build
      - run: npx chrome-webstore-upload --source dist/chrome
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
